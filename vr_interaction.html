<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UrbanVerse | VR Interaction</title>
  <meta name="description" content="Single clip for VR authoring or teleoperation inside UrbanVerse.">
  <link rel="icon" href="./static/urbanverse_images/urbanverse_logo_0.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./static/css/bulma.min.css">
  <link rel="stylesheet" href="./static/css/index.css">
  <style>
    body { background-color: #fdfaf4; font-family: 'Playfair Display', serif; padding: 4rem 1rem; }
    .content-card { max-width: 860px; margin: 0 auto; text-align: center; }
    h1 { font-size: 2.5rem; margin-bottom: 1.5rem; font-family: 'Roboto Mono', monospace; }
    video { width: 100%; border-radius: 12px; border: 1px solid rgba(0,0,0,0.08); background: black; box-shadow: 0 16px 36px rgba(0,0,0,0.2); }
    .caption { margin-top: 1rem; font-size: 1rem; color: #4a4a4a; font-family: 'Roboto Mono', monospace; }
  </style>
</head>
<body>
  <div class="content-card">
    <h1>VR Interaction Demo</h1>
    <video id="feature-video" playsinline controls controlslist="nodownload" preload="metadata" poster="./static/urbanverse_images/thumbnail_long_hori_nomask.png" data-video-src="./static/urbanverse_videos/placeholder.mp4">
      <source src="./static/urbanverse_videos/placeholder.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <p class="caption">Attach any VR capture by replacing <code>placeholder.mp4</code> or appending <code>?video=&lt;url&gt;</code>.</p>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const override = params.get('video');
      const video = document.getElementById('feature-video');
      if (!video) return;
      const source = video.querySelector('source');
      const fallback = video.dataset.videoSrc || (source ? source.src : '');

      if (override) {
        if (source) source.src = override;
        video.src = override;
        video.load();
      } else if (fallback) {
        if (source) source.src = fallback;
        video.src = fallback;
      }
    })();
  </script>
</body>
</html>
